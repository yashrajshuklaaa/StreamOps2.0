apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: streamops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:0.6.5
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 11434
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: streamops
spec:
  selector:
    app: ollama
  ports:
    - port: 11434
      targetPort: 11434
