apiVersion: v1
kind: Namespace
metadata:
  name: streamops
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: streamops-controller
  namespace: streamops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: streamops-sandbox-manager
  namespace: streamops
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/status"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: streamops-sandbox-manager
  namespace: streamops
subjects:
  - kind: ServiceAccount
    name: streamops-controller
    namespace: streamops
roleRef:
  kind: Role
  name: streamops-sandbox-manager
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: intent-engine
  namespace: streamops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: intent-engine
  template:
    metadata:
      labels:
        app: intent-engine
    spec:
      containers:
        - name: intent-engine
          image: streamops/intent-engine:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: INTENT_LISTEN_ADDR
              value: "0.0.0.0:8081"
---
apiVersion: v1
kind: Service
metadata:
  name: intent-engine
  namespace: streamops
spec:
  selector:
    app: intent-engine
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: streamops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: control-plane
  template:
    metadata:
      labels:
        app: control-plane
    spec:
      serviceAccountName: streamops-controller
      containers:
        - name: control-plane
          image: streamops/control-plane:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: STREAMOPS_NAMESPACE
              value: streamops
            - name: STREAMOPS_LISTEN_ADDR
              value: ":8000"
            - name: INTENT_ENGINE_URL
              value: http://intent-engine:8081
            - name: OLLAMA_URL
              value: http://ollama:11434/api/generate
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane
  namespace: streamops
spec:
  type: NodePort
  selector:
    app: control-plane
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
