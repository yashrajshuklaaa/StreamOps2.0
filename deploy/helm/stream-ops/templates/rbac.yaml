{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-sandbox-manager-role
  labels:
    app.kubernetes.io/name: stream-ops
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/status"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: ["streamops.ai"]
    resources: ["speculativesandboxpolicies", "agentsandboxsessions"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-sandbox-manager-rb
  labels:
    app.kubernetes.io/name: stream-ops
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-sandbox-manager-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}
