apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: speculativesandboxpolicies.streamops.ai
spec:
  group: streamops.ai
  names:
    kind: SpeculativeSandboxPolicy
    listKind: SpeculativeSandboxPolicyList
    plural: speculativesandboxpolicies
    singular: speculativesandboxpolicy
    shortNames:
      - ssp
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                toolName:
                  type: string
                image:
                  type: string
                costPerSecondUSD:
                  type: number
                coldStartSeconds:
                  type: number
                baseConfidenceThreshold:
                  type: number
                defaultTTLSeconds:
                  type: integer
                warmPoolSize:
                  type: integer
                resources:
                  type: object
                  properties:
                    cpuLimit:
                      type: string
                    memoryLimit:
                      type: string
            status:
              type: object
              properties:
                activePods:
                  type: integer
                totalSpeculations:
                  type: integer
                hitRatePercentage:
                  type: number
