apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentsandboxsessions.streamops.ai
spec:
  group: streamops.ai
  names:
    kind: AgentSandboxSession
    listKind: AgentSandboxSessionList
    plural: agentsandboxsessions
    singular: agentsandboxsession
    shortNames:
      - ass
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                sessionId:
                  type: string
                model:
                  type: string
                allocatedTool:
                  type: string
                podRef:
                  type: string
                status:
                  type: string
                  enum: ["LOOKAHEAD", "SPECULATING", "PREWARMED", "CLAIMED", "RECLAIMED"]
            status:
              type: object
              properties:
                latencyMaskedSeconds:
                  type: number
                speculationTriggerTime:
                  type: string
                executionStartTime:
                  type: string
